
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#071426">

    <meta
        name="description"
        content="The City School INSET AI Welcome Robot"
    >

    <title>INSET AI Welcome Robot | The City School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">

        <!-- Subtle background lighting -->
        <div class="glow glow-one" aria-hidden="true"></div>
        <div class="glow glow-two" aria-hidden="true"></div>

        <!-- School branding -->
        <header class="top-bar">
            <img
                src="city-school-logo.png"
                alt="The City School"
                class="school-logo"
            >
        </header>

        <!-- AI status -->
        <div class="status" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">STARTING AI VISION...</span>
        </div>

        <!-- Visitor counter -->
        <div class="visitor-counter">
            <span class="counter-label">VISITORS WELCOMED</span>
            <span id="visitorCount">00</span>
        </div>

        <!-- Robot face and welcome message -->
        <section class="robot-section" aria-label="AI welcome robot">

            <div class="robot-face">

                <!-- Expressive eyes -->
                <div class="eyes" aria-hidden="true">

                    <div class="eye left-eye">
                        <div class="pupil"></div>
                    </div>

                    <div class="eye right-eye">
                        <div class="pupil"></div>
                    </div>

                </div>

                <!-- Animated digital mouth -->
                <div
                    id="mouth"
                    class="mouth"
                    aria-hidden="true"
                ></div>

            </div>

            <!-- Welcome message -->
            <div class="welcome-text">
                <h1>Welcome to INSET!</h1>
                <p>Let's learn, explore, and innovate!</p>
            </div>

        </section>

        <!-- Camera status and instructions -->
        <footer>
            <div
                id="instruction"
                class="ai-message"
                role="status"
                aria-live="polite"
            >
                Starting camera...
            </div>
        </footer>

        <!-- Hidden camera feed for AI detection -->
        <video
            id="camera"
            autoplay
            muted
            playsinline
            aria-hidden="true"
        ></video>

    </main>

    <!-- AI libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <!-- Robot logic -->
    <script src="script.js"></script>

</body>
</html>
